title: "Clarity 5.6.0: a private hook so den-app can add and read transactions without opening Clarity"
priority: 12
model: opus
provider: claude-main
runaway: {minutes: 240}
needs: []
context: [README.md, /home/bairui/projects/den-app/docs/MONEY.md, budget/pubspec.yaml, budget/lib/main.dart, budget/lib/struct/startupGuard.dart,
          budget/lib/widgets/util/appLinks.dart, budget/lib/database/tables.dart, budget/android/app/src/main/AndroidManifest.xml,
