protected: [.den/tasks/**, .den/project.yaml, .den/setup.sh, .den/checks/check_release_r1.sh, .den/checks/check_self_update.sh,
            .den/checks/check_app_sync.sh, .den/checks/check_server.py, .den/checks/check_money_summary.py, .den/checks/check_startup.sh, server/**]
done_when: bash .den/checks/check_den_hook.sh
do: |
  THE JOB
  Brian, 2026-11-19 and 20: "I want den app to have hooks to clarity. so a mini app can do the basics and add
  expenses to the database. full app still needs to be installed for backup and advanced features." and
  "Shouldn't we build the den-app hook I asked for? The ability to add transactions from den-app?"
  den-app is his phone hub (package com.hanquest.den). Build Clarity's side: the content provider PINNED in
  den-app docs/MONEY.md, section "The hook, as pinned (2026-11-20)" (in context: it is the contract, read it
  first; the den-app side is being built against the same text by another worker, so do not change names,
  shapes or codes: if something in it cannot be built, stop and say exactly what).
  In short: authority `com.clarity.finance.den`, `ContentResolver.call` only, seven methods (hello, add,
  remove, recent, categories, accounts, month), JSON in and out, callable ONLY by com.hanquest.den with the
  pinned signing-certificate SHA-256, an `add` that is safe to repeat (caller-made id), `remove` only for
  rows that came in through the hook, and it must work when Clarity is not running without bringing its
  window to the front.
  What you decide (say each under "## Choices" in .den/checks/NOTES.md):
  - HOW CLARITY'S OWN CODE RUNS IN THE BACKGROUND. The write must go through the same Dart path the app's
    "add transaction" uses (so budgets, the change log the backup reads, and the auto-backup that follows all
    behave), not a second hand-written SQL insert in Kotlin. The expected shape: the provider starts a
    headless FlutterEngine on a dedicated Dart entrypoint and talks to it over a MethodChannel, waiting at
    most 10 s (`busy` after that); when the app is already running, use what is safe with drift and SQLite
    (one writer at a time; the UI must show the new row without a restart: say how, e.g. the UI's streams
    are told to refresh). The provider's `call` runs on a binder thread; never block the main thread.
  - WHERE THE CALLER'S ID LIVES so that a repeated `add` finds the saved row and `remove` knows the row came
    through the hook, WITHOUT changing the drift schema version or anything the backup format or Cashew
    import depends on (a small side table in a separate file, or a marker the existing schema already has
    room for; a schema migration is not acceptable in this task).
  - Name matching for category, subcategory and account follows appLinks.dart's existing matching; an
    unknown name is `bad_args`.
  Also:
  - `hello` answers `api: 1` and the app's version; the manifest exports the provider with no permission
    attribute that would hide it from den-app, and the caller check is done in code on every call
    (Binder.getCallingUid -> packages -> signing certificates, including rotated ones).
  - Money amounts: the hook takes a positive `amount` and `income`; store it with Clarity's own sign rule.
    Dates are epoch milliseconds; "this month" uses the phone's zone.
  - Version 5.6.0 (build 419). Do NOT publish: the managing agent runs bin/release and installs it.
  - .den/checks/check_den_hook.sh (yours; the done_when), failing on today's tree: cheap source checks
    (authority, exported, the pinned certificate constant, no schema version change), flutter tests for the
    Dart side of every method (add twice with one id saves one row; unknown category is bad_args; remove of
    a row not from the hook is not_found; recent and month read what add wrote; the sign rule), a JVM or
    Robolectric test of the caller check if the project's Android test setup allows it (if not, say so and
    test the check's pure function), and `bin/release --dry-run` still passing check_startup's APK rule.
    Add its pins to .den/checks/NOTES.md.
  - A short section in README.md: what the hook is, who may call it, how to try it with adb
    (`adb shell content call --uri content://com.clarity.finance.den --method hello` is DENIED from the
    shell by design: say how the managing agent can still exercise it, e.g. a debug-only allowance for the
    shell uid that is compiled OUT of release builds, and prove it is out).

  THE WHY
  He records expenses many times a day and lives in den-app. Opening a second app for each coffee is the
  friction that makes people stop recording. The full app stays the owner of the data and the place for
  everything advanced; this is the quick door.

  THE GUARDRAILS
  - Nothing may weaken who can read his money data: no exported activity, receiver or provider other than this
    one; no "any caller in debug" path that can reach a release build; no logging of amounts, titles or notes
    to logcat (ids and error codes only).
  - Do not touch server/ or the earlier checks. Do not change signing. Never print a password or key.
  - Do not run bin/release without --dry-run. Do not write under /srv/www. Do not install anything on a phone.
  - One Flutter/Gradle build at a time; never `./gradlew --stop`.
  - budget/pubspec.lock: commit a change only if your dependency change needs it, and say so.
  - NEVER run a command that feeds a script through a heredoc (`python3 - <<EOF`, `bash <<EOF`, `cat <<EOF |`).
    Write the script to a file and run the file.
  - Wait for every background shell you started to finish before your verdict. Stage files by name.

  DONE MEANS
  - `bash .den/checks/check_den_hook.sh` exits 0 on your commit and you saw it fail before your change.
  - Report in 3 bullets: how the background path works, where the id lives, and what is NOT verified (nobody
    has run this on a phone: say which parts only a real device can prove).
