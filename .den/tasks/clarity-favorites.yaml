done_when: bash .den/checks/check_favorites.sh
do: |
  THE JOB
  Brian, 2026-11-23, from his phone, about the Money mini-app in den-app (his phone hub, com.hanquest.den), which
  adds expenses to Clarity through the private hook built in 5.6.0: "I want favorites or suggestions. the
  feature is the same, simply what we call it. functionality, common entries are a single click. category, sub
  category and name. cost every then comes up. example human Archive, transportation, taxi to JHH or taxi home.
  they are daily, even mostly at the same time. if we analyze the database we can pick out a lot of them. ...
  any transaction can be long pressed and added as favorite. similar mechanic for removal or editing an
  exciting favorite." Asked where favorites should live, he chose Clarity: "yes in the database."
  Build Clarity's side: hook api 2, PINNED in den-app docs/MONEY.md, section "Stage 3 ... favorites, kept in
  Clarity (hook api 2, Clarity 5.7.0)" (in context: it is the contract, read it first together with the api 1
  section above it; the den-app host and the mini-app are built against the same text by other workers, so do
  not change names, shapes or codes: if something in it cannot be built, stop and say exactly what).
  In short: five new methods on the existing provider (favorites, favorite_save, favorite_remove, suggestions,
  suggestion_dismiss), the same caller check and answer shape as api 1, `hello` answers api 2, and everything
  of api 1 behaves exactly as before (check_den_hook.sh, protected, must still pass).
  What you decide (say each under "## Choices" in .den/checks/NOTES.md):
  - WHERE FAVORITES AND DISMISSALS ARE KEPT. They must travel with Clarity's backup to red and come back on a
    restore. The hard rule: a backup made by 5.7.0 restores in 5.6.0, a backup made by 5.6.0 restores in 5.7.0,
    and the Cashew import still works. Read how the backup and restore choose what to carry and how 5.6.0
    reacts to something it does not know BEFORE choosing (a new drift table with a schema step, or the side
    store api 1 uses for hook ids made part of the backup). Prove the rule with tests in both directions; if
    it cannot be met, stop and say what the options cost.
  - HOW "MATCHES" IS DECIDED between a favorite or suggestion and transactions: same category, subcategory and
    title, compared the way Clarity already compares names (case, surrounding spaces; say what you did about
    near-duplicates such as "Taxi to JHH" and "taxi to jhh ", and that you did NOT merge different titles).
  - THE ORDER. `favorites` and `suggestions` put first what he usually enters around `now_ms`: the same
    weekday and nearby hours count most, then overall frequency, then recency. Choose simple, explainable
    weights, write them down, and test them with a history where a morning taxi and an evening taxi swap
    places between 08:00 and 19:00 and a weekday lunch drops on Sunday.
  - THE COST OF THE ANALYSIS. `suggestions` reads the whole history (his has several thousand rows and will
    grow). It must answer inside the hook's 10 s bound on a mid-range phone with 20,000 transactions: do the
    grouping in SQL, not row by row in Dart, and say what you measured in a test with 20,000 generated rows.
  Also:
  - `usual_amount` is the most frequent amount among matching transactions (ties: the most recent); `uses`
    their count; a favorite with no matching transaction yet has usual_amount null and uses 0.
  - `favorite_save` with a known id replaces (Edit); a second favorite with the same category, subcategory
    and title answers the existing one; unknown category, subcategory or account is bad_args; an empty title is
    bad_args. A suggestion needs at least 3 matching transactions, is never already a favorite, never a
    dismissed key. Keeping one (favorite_save with its fields) removes it from suggestions.
  - Clarity's own screens: add NOTHING visible in this task (a star inside Clarity may come later); the app
    must look and behave exactly as 5.6.0 to someone who never uses den-app.
  - Works with Clarity not running, never brings its window to the front, as api 1.
  - Version 5.7.0 (the next build number after the one in budget/pubspec.yaml). Do NOT publish: the managing
    agent runs bin/release and installs it.
  - .den/checks/check_favorites.sh (yours; the done_when), failing on today's tree: cheap source checks (the
    five method names, api 2), flutter tests for the Dart side of every new method and each rule above
    (replace on a known id, the duplicate rule, bad_args cases, the 3-transaction threshold, dismiss is for
    good, keep removes the suggestion, the order cases, usual_amount ties, the 20,000-row bound, both backup
    directions), `bash .den/checks/check_den_hook.sh` still green, and `bin/release --dry-run` still passing
    check_startup's APK rule. Add its pins to .den/checks/NOTES.md.
  - README.md: extend the hook section with api 2 and how the managing agent can try the new methods.

  THE WHY
  He records the same handful of expenses every day, mostly at the same hours: the taxi to work, the taxi
  home. Picking category, subcategory and typing the name each time is the friction. With favorites kept by
  Clarity, one tap and the amount is all that is left, and what he sets up is safe in Clarity's own backup.

  THE GUARDRAILS
  - Nothing may weaken who can read his money data: no new exported component, no path that lets another
    caller in, no logging of amounts, titles or notes to logcat (ids and error codes only).
  - His data is real and has no second copy outside the backups: never write a migration that can lose or
    rewrite existing transactions, categories or budgets; a failed schema step must leave 5.6.0's data
    readable. Test the upgrade from a 5.6.0 database file.
  - Do not touch server/ or the earlier checks. Do not change signing. Never print a password or key.
  - Do not run bin/release without --dry-run. Do not write under /srv/www. Do not install anything on a phone.
  - One Flutter/Gradle build at a time; never `./gradlew --stop`.
  - budget/pubspec.lock: commit a change only if your dependency change needs it, and say so.
  - NEVER run a command that feeds a script through a heredoc (`python3 - <<EOF`, `bash <<EOF`, `cat <<EOF |`).
    Write the script to a file and run the file.
  - Wait for every background shell you started to finish before your verdict. Stage files by name.

  DONE MEANS
  - `bash .den/checks/check_favorites.sh` exits 0 on your commit and you saw it fail before your change.
  - Report in 3 bullets: where favorites are kept and how both backup directions were proven, the order's
    weights, and what is NOT verified (nobody has run this on a phone: say which parts only a real device can
    prove). Before reporting, check each claim against a tool result from this session.
