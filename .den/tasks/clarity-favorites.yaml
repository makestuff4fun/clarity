title: "Clarity 5.7.0: favorites and suggestions through the den-app hook (api 2)"
priority: 12
model: opus
provider: claude-main
runaway: {minutes: 300}
needs: []
context: [README.md, /home/bairui/projects/den-app/docs/MONEY.md, budget/pubspec.yaml, budget/lib/main.dart,
          budget/lib/database/tables.dart, budget/android/app/src/main/AndroidManifest.xml, bin/release,
          .den/checks/check_den_hook.sh, .den/checks/check_startup.sh, .den/checks/NOTES.md]
protected: [.den/tasks/**, .den/project.yaml, .den/setup.sh, .den/checks/check_release_r1.sh, .den/checks/check_self_update.sh,
            .den/checks/check_app_sync.sh, .den/checks/check_server.py, .den/checks/check_money_summary.py, .den/checks/check_startup.sh,
